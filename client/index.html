<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cats vs Dogs</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1c1f2b; --muted:#6b7280; --cats:#6366f1; --dogs:#f59e0b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12141c; --card:#1c2030; --text:#eceef5; --muted:#9aa1b5; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background:var(--bg); color:var(--text); display:flex; justify-content:center; padding:32px 16px; }
  main { width:100%; max-width:520px; }
  h1 { text-align:center; margin:0 0 4px; }
  .sub { text-align:center; color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border-radius:14px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .buttons { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  button { font-size:1.1rem; padding:16px; border:2px solid transparent; border-radius:12px; cursor:pointer;
           color:#fff; font-weight:600; transition:transform .1s, opacity .2s; }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.6; cursor:wait; }
  #btn-cats { background:var(--cats); } #btn-dogs { background:var(--dogs); }
  button.selected { border-color:var(--text); }
  .row { margin:14px 0; }
  .label { display:flex; justify-content:space-between; font-weight:600; margin-bottom:6px; }
  .bar { height:14px; background:rgba(128,128,128,.2); border-radius:7px; overflow:hidden; }
  .fill { height:100%; width:0; transition:width .4s; }
  #fill-cats { background:var(--cats); } #fill-dogs { background:var(--dogs); }
  #status { text-align:center; min-height:1.4em; color:var(--muted); margin-top:16px; font-size:.95rem; }
  #total { text-align:center; color:var(--muted); font-size:.9rem; margin-top:4px; }
</style>
</head>
<body>
<main>
  <h1>Cats vs Dogs</h1>
  <p class="sub">Pick a side. You can change your vote anytime.</p>
  <div class="card">
    <div class="buttons">
      <button id="btn-cats" data-choice="cats">🐱 Cats</button>
      <button id="btn-dogs" data-choice="dogs">🐶 Dogs</button>
    </div>

    <div class="row">
      <div class="label"><span>Cats</span><span id="count-cats">0 (0%)</span></div>
      <div class="bar"><div class="fill" id="fill-cats"></div></div>
    </div>
    <div class="row">
      <div class="label"><span>Dogs</span><span id="count-dogs">0 (0%)</span></div>
      <div class="bar"><div class="fill" id="fill-dogs"></div></div>
    </div>

    <div id="total"></div>
    <div id="status"></div>
  </div>
</main>

<script>
  const CHOICES = ["cats", "dogs"];

  // crypto.randomUUID only exists on HTTPS, so fall back for plain-HTTP testing
  function newId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "v-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
  }

  let voterId, myVote = null;
  try {
    voterId = localStorage.getItem("voter_id");
    if (!voterId) { voterId = newId(); localStorage.setItem("voter_id", voterId); }
    myVote = localStorage.getItem("my_vote");
  } catch (e) { voterId = newId(); }

  const statusEl = document.getElementById("status");

  function markSelected() {
    CHOICES.forEach(c =>
      document.getElementById("btn-" + c).classList.toggle("selected", c === myVote));
  }

  async function castVote(choice) {
    const buttons = document.querySelectorAll("button");
    buttons.forEach(b => b.disabled = true);
    statusEl.textContent = "Sending your vote...";
    try {
      const res = await fetch("/api/vote", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ voter_id: voterId, choice })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      myVote = choice;
      try { localStorage.setItem("my_vote", choice); } catch (e) {}
      markSelected();
      statusEl.textContent = "Vote received! Results update in a moment.";
      setTimeout(refresh, 1000);
    } catch (err) {
      statusEl.textContent = "Could not send your vote. Please try again.";
    } finally {
      buttons.forEach(b => b.disabled = false);
    }
  }

  async function refresh() {
    try {
      const res = await fetch("/api/results");
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const total = CHOICES.reduce((sum, c) => sum + (data[c] || 0), 0);
      CHOICES.forEach(c => {
        const n = data[c] || 0;
        const pct = total ? Math.round((n / total) * 100) : 0;
        document.getElementById("count-" + c).textContent = n + " (" + pct + "%)";
        document.getElementById("fill-" + c).style.width = pct + "%";
      });
      document.getElementById("total").textContent = total + (total === 1 ? " vote" : " votes") + " in total";
    } catch (err) { /* keep the last values on screen */ }
  }

  document.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => castVote(b.dataset.choice)));

  markSelected();
  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
