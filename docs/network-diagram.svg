<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1080" viewBox="0 0 680 540" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Network diagram of the voting app on AWS</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="540" fill="#FFFFFF"/>

<rect x="250" y="20" width="180" height="44" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">Internet</text>

<rect x="40" y="100" width="600" height="410" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="60" y="122" font-size="14" font-weight="bold" fill="#444441">VPC</text>

<rect x="60" y="140" width="560" height="130" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="80" y="164" font-size="14" font-weight="bold" fill="#085041">Public subnet</text>
<text x="196" y="164" font-size="12" fill="#0F6E56">10.0.1.0/24</text>

<rect x="60" y="320" width="560" height="170" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="80" y="344" font-size="14" font-weight="bold" fill="#3C3489">Private subnet</text>
<text x="196" y="344" font-size="12" fill="#534AB7">10.0.2.0/24</text>

<rect x="80" y="180" width="520" height="72" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="340" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">Frontend EC2 · 10.0.1.90</text>
<text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Nginx container, port 80</text>
<text x="340" y="236" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Security group: allow 80 from internet</text>

<rect x="80" y="360" width="520" height="116" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="340" y="378" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">Backend EC2 · 10.0.2.120</text>
<text x="340" y="396" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Security group: allow 5000 from frontend SG only</text>

<rect x="96" y="410" width="110" height="48" rx="6" fill="#F7F7F5" stroke="#888780" stroke-width="1"/>
<text x="151" y="427" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">api</text>
<text x="151" y="444" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">port 5000</text>

<rect x="222" y="410" width="110" height="48" rx="6" fill="#F7F7F5" stroke="#888780" stroke-width="1"/>
<text x="277" y="427" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">worker</text>
<text x="277" y="444" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">queue consumer</text>

<rect x="348" y="410" width="110" height="48" rx="6" fill="#F7F7F5" stroke="#888780" stroke-width="1"/>
<text x="403" y="427" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">redis</text>
<text x="403" y="444" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">queue + tallies</text>

<rect x="474" y="410" width="110" height="48" rx="6" fill="#F7F7F5" stroke="#888780" stroke-width="1"/>
<text x="529" y="427" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">db</text>
<text x="529" y="444" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">PostgreSQL 16</text>

<line x1="340" y1="64" x2="340" y2="178" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="352" y="84" font-size="12" fill="#444441">HTTP :80</text>
<text x="352" y="124" font-size="12" fill="#444441">via internet gateway</text>

<line x1="340" y1="252" x2="340" y2="358" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="352" y="298" font-size="12" fill="#444441">/api/ proxy to :5000</text>
</svg>
