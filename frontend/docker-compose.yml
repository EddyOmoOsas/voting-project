 build: ../api
    environment:
      REDIS_HOST: redis
    depends_on: [redis]

  worker:
    build: ../worker
    environment:
      REDIS_HOST: redis
      DATABASE_URL: postgresql://postgres:postgres@db:5432/votes
    depends_on: [redis, db]

  web:
    build: ../client
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]

volumes:
  pgdata:

