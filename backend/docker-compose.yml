services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: votes
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
  api:
    build: ../api
    environment:
      REDIS_HOST: redis
    ports:
      - "5000:5000"
    depends_on: [redis]
  worker:
    build: ../worker
    environment:
      REDIS_HOST: redis
      DATABASE_URL: postgresql://postgres:postgres@db:5432/votes
    depends_on: [redis, db]
volumes:
  pgdata:
