name: Build and Push to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'worker/**'
      - 'client/**'
      - '.github/workflows/push.yml'

env:
  REGISTRY: ghcr.io
  GITHUB_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GITHUB_OWNER }}/voting-app-api:latest,${{ env.REGISTRY }}/${{ env.GITHUB_OWNER }}/voting-app-api:${{ github.sha }}

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GITHUB_OWNER }}/voting-app-worker:latest,${{ env.REGISTRY }}/${{ env.GITHUB_OWNER }}/voting-app-worker:${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GITHUB_OWNER }}/voting-app-web:latest,${{ env.REGISTRY }}/${{ env.GITHUB_OWNER }}/voting-app-web:${{ github.sha }}
